# ---------------------------------------------------------- read · correctness
- key: mixed_line_endings
  label: Mixed line endings
  group: Correctness
  capability: read
  type: string
  class: design-choice
  order: 60

- key: reread_dedup
  label: Re-read dedup
  group: Correctness
  capability: read
  type: string
  class: design-choice
  order: 61

- key: staleness_check
  label: Staleness check before write
  short: Staleness check
  group: Correctness
  capability: read
  type: boolean
  class: invariant
  holds_when: "true"
  headline: true
  order: 62
  description: >-
    If the file changed after the agent read it, the write should not go through
    unnoticed. Without this an agent silently overwrites whatever happened in
    between — invisible to the user until data is gone.

- key: line_number_guard
  label: Line-number contamination guard
  short: Line-number guard
  group: Correctness
  capability: read
  type: string
  class: design-choice
  order: 63
  description: >-
    Whether anything stops the model writing the `1|` prefix back into the file.
    Two harnesses guard against it in two different places; neither has data on
    how often it happens.

- key: multi_file_read
  label: Multi-file read
  group: Correctness
  capability: read
  type: string
  class: design-choice
  order: 64

# -------------------------------------------------------- read · side effects
- key: warms_lsp
  label: Warms LSP on read
  group: Side effects
  capability: read
  type: string
  class: design-choice
  order: 70

- key: injects_instruction_files
  label: Injects nearby instruction files
  short: Injects instruction files
  group: Side effects
  capability: read
  type: string
  class: design-choice
  order: 71
  description: >-
    Whether reading a file also pulls AGENTS.md / CLAUDE.md into context. A read
    tool that quietly adds instructions is doing two jobs.
