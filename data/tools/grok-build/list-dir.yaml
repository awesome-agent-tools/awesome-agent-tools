observations:
  - key: search_kind
    value: "by-name"
    note: >-
      It lists a tree rather than matching a pattern — there is no glob
      argument — so it answers "what is in here" rather than "where is this".
    source_url: https://github.com/xai-org/grok-build/blob/72a61251fcff/crates/codegen/xai-grok-tools/src/implementations/grok_build/list_dir/mod.rs
    method: source
  - key: search_tool_split
    value: "two tools"
    source_url: https://github.com/xai-org/grok-build/blob/72a61251fcff/crates/codegen/xai-grok-tools/src/implementations/grok_build/list_dir/mod.rs
    method: source
  - key: search_engine
    value: "in-process directory walk"
    note: >-
      Depth-1 children are seeded first, then a breadth-first expansion runs
      against a character budget, so a wide tree degrades by breadth rather
      than by cutting off at the first deep branch.
    source_url: https://github.com/xai-org/grok-build/blob/72a61251fcff/crates/codegen/xai-grok-tools/src/implementations/grok_build/list_dir/mod.rs
    method: source
  - key: glob_syntax
    status: not-applicable
    note: "No pattern argument."
    method: source
  - key: case_sensitivity_default
    status: not-applicable
    method: source
  - key: result_cap
    value: "character budget"
    note: >-
      Plus separate hard caps on deep-walk items and on depth-1 seed entries,
      the latter so a directory with millions of direct children cannot
      exhaust the budget before the walk starts.
    source_url: https://github.com/xai-org/grok-build/blob/72a61251fcff/crates/codegen/xai-grok-tools/src/implementations/grok_build/list_dir/mod.rs
    method: source
