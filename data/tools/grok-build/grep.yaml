  - key: search_kind
    value: "by-content"
    source_url: https://github.com/xai-org/grok-build/blob/72a61251fcff/crates/codegen/xai-grok-tools/src/implementations/grok_build/grep/mod.rs
    method: source
  - key: search_tool_split
    value: "two tools"
    note: >-
      grep for contents, list_dir for names — but list_dir walks a tree
      rather than matching a pattern, so there is no glob half here.
    source_url: https://github.com/xai-org/grok-build/blob/72a61251fcff/crates/codegen/xai-grok-tools/src/implementations/grok_build/grep/mod.rs
    method: source
  - key: search_engine
    value: "bundled ripgrep"
    source_url: https://github.com/xai-org/grok-build/blob/72a61251fcff/crates/codegen/xai-grok-tools/src/implementations/grok_build/grep/ripgrep.rs
    method: source
  - key: regex_dialect
    value: "Rust regex"
    note: >-
      The description tells the model to escape literal specials and gives two
      worked examples, which is the only place in this survey where the
      dialect's sharp edges are explained to the caller rather than left to be
      discovered.
    source_url: https://github.com/xai-org/grok-build/blob/72a61251fcff/crates/codegen/xai-grok-tools/src/implementations/grok_build/grep/mod.rs
    method: source
  - key: case_sensitivity_default
    value: "sensitive, model can ask"
    source_url: https://github.com/xai-org/grok-build/blob/72a61251fcff/crates/codegen/xai-grok-tools/src/implementations/grok_build/grep/mod.rs
    method: source
  - key: search_line_numbers
    value: "N: under a path heading"
    note: >-
      --heading groups matches by file; ':' marks a match line and '-' a
      context line.
    source_url: https://github.com/xai-org/grok-build/blob/72a61251fcff/crates/codegen/xai-grok-tools/src/implementations/grok_build/grep/mod.rs
    method: source
  - key: result_cap
    value: "head limit, mode-dependent"
    note: >-
      A per-mode default the model can raise up to a hard ceiling; also a
      2000-character line cap and a 10,000-file ceiling.
    source_url: https://github.com/xai-org/grok-build/blob/72a61251fcff/crates/codegen/xai-grok-tools/src/implementations/grok_build/grep/mod.rs
    method: source
  - key: search_announces_truncation
    value: "true"
    note: >-
      Capped results report "at least" counts rather than a total, because
      ripgrep is killed early and the true figure is not known. It is also the
      only implementation here that reads one line past the budget
      specifically so an exact-fit result is not mislabelled as truncated.
    source_url: https://github.com/xai-org/grok-build/blob/72a61251fcff/crates/codegen/xai-grok-tools/src/implementations/grok_build/grep/mod.rs
    method: source
  - key: no_match_signal
    status: unverified
    method: source
  - key: grep_line_agrees_with_read
    status: unverified
    note: >-
      The grep half is 1-indexed; Grok Build's read tool has not been read
      from source, so the pair has not been checked.
    method: source
  - key: search_marks_file_read
    status: unverified
    method: source
  - key: respects_gitignore
