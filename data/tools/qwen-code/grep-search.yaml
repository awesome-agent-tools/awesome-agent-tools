exposed_name: grep_search
owner:
  type: agent
  id: qwen-code
capabilities:
  - id: code-search
    role: primary

source:
  url: https://github.com/QwenLM/qwen-code
  commit: 56f75adf2992
  checked_at: 2026-09-04
observations:
  - key: search_kind
    value: "by-content"
    source_url: https://github.com/QwenLM/qwen-code/blob/56f75adf2992/packages/core/src/tools/ripGrep.ts
    method: source
  - key: search_tool_split
    value: "two tools"
    source_url: https://github.com/QwenLM/qwen-code/blob/56f75adf2992/packages/core/src/tools/ripGrep.ts
    method: source
  - key: search_engine
    value: "ripgrep, else git grep, else grep, else JS regex"
    note: >-
      Two implementations of the same tool name ship side by side
      (ripGrep.ts and grep.ts); the fallback chain ends in an in-process
      JavaScript scan.
    source_url: https://github.com/QwenLM/qwen-code/blob/56f75adf2992/packages/core/src/tools/grep.ts
    method: source
  - key: regex_dialect
    value: "varies by backend: Rust regex, git grep, POSIX, or JS RegExp"
    source_url: https://github.com/QwenLM/qwen-code/blob/56f75adf2992/packages/core/src/tools/ripGrep.ts
    method: source
  - key: case_sensitivity_default
    value: "always insensitive, not configurable"
    note: >-
      --ignore-case is appended unconditionally when building the ripgrep
      argv.
    source_url: https://github.com/QwenLM/qwen-code/blob/56f75adf2992/packages/core/src/tools/grep.ts
    method: source
  - key: search_line_numbers
    value: "LN: and path:line:text"
    note: >-
      1-indexed; the JS fallback numbers with index + 1.
    source_url: https://github.com/QwenLM/qwen-code/blob/56f75adf2992/packages/core/src/tools/ripGrep.ts
    method: source
  - key: result_cap
    value: "line and character limits, both announced"
    source_url: https://github.com/QwenLM/qwen-code/blob/56f75adf2992/packages/core/src/tools/ripGrep.ts
    method: source
  - key: search_announces_truncation
    value: "true"
    note: >-
      "[N lines truncated] ..." is appended when either the line or the
      character budget bites.
    source_url: https://github.com/QwenLM/qwen-code/blob/56f75adf2992/packages/core/src/tools/ripGrep.ts
    method: source
  - key: no_match_signal
    value: "sentence"
    note: >-
      "No matches found for pattern ..." — the sentence names the pattern and
      the search location.
    source_url: https://github.com/QwenLM/qwen-code/blob/56f75adf2992/packages/core/src/tools/ripGrep.ts
    method: source
  - key: grep_line_agrees_with_read
    value: "false"
    note: >-
      Search reports 1-indexed line numbers; read_file's offset is
      documented as "the 0-based line number to start reading from". A hit
      reported at L42 is at read_file offset 41.
    source_url: https://github.com/QwenLM/qwen-code/blob/56f75adf2992/packages/core/src/tools/ripGrep.ts
    method: source
  - key: search_marks_file_read
    value: "yes — matched files are recorded as partial reads"
    note: >-
      recordGrepResultFileReads stats every matched path and calls
      cache.recordRead(..., {full: false}), so a file the model has seen one
      line of is registered with the read cache.
    source_url: https://github.com/QwenLM/qwen-code/blob/56f75adf2992/packages/core/src/tools/ripGrep.ts
    method: source
  - key: respects_gitignore
    value: "yes, plus .qwenignore"
    note: >-
      --no-ignore-vcs is only passed when respectGitIgnore is turned off.
    source_url: https://github.com/QwenLM/qwen-code/blob/56f75adf2992/packages/core/src/tools/grep.ts
    method: source
  - key: searches_hidden_files
    status: unverified
    method: source
  - key: search_binary_guard
    status: unverified
    method: source
  - key: result_ordering
    status: unverified
    method: source
