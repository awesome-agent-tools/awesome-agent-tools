    method: source
  - key: regex_dialect
    value: "Rust regex"
    note: >-
      No backreferences and no lookaround; such a pattern returns no matches
      rather than an error.
    source_url: https://github.com/anomalyco/opencode/blob/8a6cf2c9aa1a/packages/opencode/src/tool/grep.ts
    method: source
  - key: case_sensitivity_default
    status: unverified
    method: source
  - key: search_line_numbers
    value: "Line N:"
    note: >-
      Grouped under a path: header, from rg --json.
    source_url: https://github.com/anomalyco/opencode/blob/8a6cf2c9aa1a/packages/opencode/src/tool/grep.ts
    method: source
  - key: result_cap
    value: "100 matches"
    source_url: https://github.com/anomalyco/opencode/blob/8a6cf2c9aa1a/packages/opencode/src/tool/grep.ts
    method: source
  - key: search_announces_truncation
    value: "true"
    note: >-
      "Found N matches (more matches available)" plus "(Results truncated.
      Consider using a more specific path or pattern.)".
    source_url: https://github.com/anomalyco/opencode/blob/8a6cf2c9aa1a/packages/opencode/src/tool/grep.ts
    method: source
  - key: no_match_signal
    value: "sentence"
    note: >-
      "No files found" — the same string the glob tool uses for an empty
      result.
    source_url: https://github.com/anomalyco/opencode/blob/8a6cf2c9aa1a/packages/opencode/src/tool/grep.ts
    method: source
  - key: grep_line_agrees_with_read
    value: "true"
    note: >-
      Both are 1-indexed.
    source_url: https://github.com/anomalyco/opencode/blob/8a6cf2c9aa1a/packages/opencode/src/tool/grep.ts
    method: source
  - key: search_marks_file_read
    status: unverified
    method: source
  - key: respects_gitignore
    value: "yes"
    source_url: https://github.com/anomalyco/opencode/blob/8a6cf2c9aa1a/packages/core/src/ripgrep.ts
    method: source
  - key: searches_hidden_files
    value: "yes, except .git"
    note: >-
      --hidden is passed unconditionally for content search but only on
      request for glob, so the two halves of this harness disagree about
      dotfiles.
    source_url: https://github.com/anomalyco/opencode/blob/8a6cf2c9aa1a/packages/core/src/ripgrep.ts
    method: source
  - key: search_binary_guard
    status: unverified
    method: source
  - key: result_ordering
    value: "ripgrep traversal order"
    note: >-
      No --sort flag, so results arrive in whatever order the parallel
      walker produces.
    source_url: https://github.com/anomalyco/opencode/blob/8a6cf2c9aa1a/packages/opencode/src/tool/grep.ts
    method: source
