# Codex · exec_command
# Read observations seeded from docs/research/; code-search observations added
# by the code-search source pass at the pinned commit below.
exposed_name: exec_command
owner:
  type: agent
  id: codex
capabilities:
  - id: shell
    role: primary
  - id: read
    role: partial
  - id: code-search
    role: partial
via: Reached through the shell rather than a dedicated tool.
source:
  url: https://github.com/openai/codex
  commit: 531f3836a1e3
  checked_at: 2026-09-05
observations:
  # -- code search. Confirmed by absence at the pinned commit: the tool tree
  #    carries no grep, glob or file-search implementation, so searching means
  #    the model typing rg or find into the shell like anyone else.
  - key: search_kind
    value: "shell"
    source_url: https://github.com/openai/codex/tree/531f3836a1e3/codex-rs/core/src/tools/handlers
    method: source
  - key: search_tool_split
    value: "no search tool"
    note: >-
      The same answer Codex gives for read. The shell is already there and it
      composes, but nothing about the search is the harness's to shape.
    source_url: https://github.com/openai/codex/tree/531f3836a1e3/codex-rs/core/src/tools/handlers
    method: source
  - key: search_engine
    value: "whatever is on the machine"
    note: >-
      rg if the user installed it, grep otherwise, with different regex
      dialects and different default scope. The harness makes no choice here,
      so neither does the agent.
    source_url: https://github.com/openai/codex/tree/531f3836a1e3/codex-rs/core/src/tools/handlers
    method: source
  - key: regex_dialect
    value: "whatever is on the machine"
    source_url: https://github.com/openai/codex/tree/531f3836a1e3/codex-rs/core/src/tools/handlers
    method: source
  - key: glob_syntax
    value: "whatever is on the machine"
    source_url: https://github.com/openai/codex/tree/531f3836a1e3/codex-rs/core/src/tools/handlers
    method: source
  - key: case_sensitivity_default
    value: "whatever is on the machine"
    source_url: https://github.com/openai/codex/tree/531f3836a1e3/codex-rs/core/src/tools/handlers
    method: source
  - key: search_line_numbers
    value: "only if the model asks"
    note: >-
      grep prints line numbers with -n and not otherwise, so whether a search
      result can be turned back into a location depends on the flag the model
      happened to type.
    source_url: https://github.com/openai/codex/tree/531f3836a1e3/codex-rs/core/src/tools/handlers
    method: source
  - key: result_cap
    value: "none"
    note: >-
      No cap of the harness's own; a broad pattern returns everything it
      matched, straight into the context window.
    source_url: https://github.com/openai/codex/tree/531f3836a1e3/codex-rs/core/src/tools/handlers
    method: source
  - key: search_announces_truncation
    status: not-applicable
    note: >-
      Nothing truncates, so there is nothing to announce. The invariant is not
      met or broken here — it does not arise.
    method: source
  - key: no_match_signal
    value: "empty stdout"
    note: >-
      The one case on this page where a search that found nothing and a search
      that failed look identical to the model.
    source_url: https://github.com/openai/codex/tree/531f3836a1e3/codex-rs/core/src/tools/handlers
    method: source
  - key: grep_line_agrees_with_read
    status: not-applicable
    note: "No read tool either; both halves are the shell."
    method: source
  - key: search_marks_file_read
    value: "no read tracking at all"
    source_url: https://github.com/openai/codex/tree/531f3836a1e3/codex-rs/core/src/tools/handlers
    method: source
  - key: respects_gitignore
    value: "whatever is on the machine"
    note: "rg does, grep -R does not."
    source_url: https://github.com/openai/codex/tree/531f3836a1e3/codex-rs/core/src/tools/handlers
    method: source
  - key: searches_hidden_files
    value: "whatever is on the machine"
    source_url: https://github.com/openai/codex/tree/531f3836a1e3/codex-rs/core/src/tools/handlers
    method: source
  - key: search_binary_guard
    value: "false"
    note: >-
      Same failure as its read: grep without -I puts matched bytes from a
      binary file straight into context with nothing marking them as binary.
    source_url: https://github.com/openai/codex/tree/531f3836a1e3/codex-rs/core/src/tools/handlers
    method: source
  - key: result_ordering
    value: "whatever is on the machine"
    source_url: https://github.com/openai/codex/tree/531f3836a1e3/codex-rs/core/src/tools/handlers
    method: source
  # -- read
  - key: dedicated_tool
    value: none — cat/sed via exec_command
    method: source
  - key: line_number_format
    value: none
    note: Raw bytes, no numbering at all.
    method: source
  - key: output_wrapper
    value: raw stdout
    method: source
  - key: default_line_cap
    value: none
    method: source
  - key: byte_cap
    value: none
    method: source
  - key: per_line_cap
    value: none
    method: source
  - key: limit_precedence
    status: not-applicable
    method: source
  - key: offset_base
    status: not-applicable
    note: n/a
    method: source
  - key: continuation_hint
    status: not-applicable
    method: source
  - key: reports_total_lines
    status: not-applicable
    method: source
  - key: out_of_range_offset
    status: not-applicable
    note: n/a
    method: source
  - key: binary_handling
    value: raw bytes into context
    method: source
  - key: image_handling
    value: separate view_image
    method: source
  - key: giant_line_handling
    value: none
    method: source
  - key: missing_path_behavior
    value: shell error
    method: source
  - key: directory_path_behavior
    value: lists
    method: source
  - key: empty_file_behavior
    value: empty stdout
    method: source
  - key: non_vision_model_behavior
    status: not-applicable
    method: source
  - key: mixed_line_endings
    value: raw
    method: source
  - key: line_number_guard
    status: not-applicable
    note: n/a (no numbers)
    method: source
  - key: staleness_check
    value: false
    method: source
  - key: binary_not_silent
    value: false
    note: Reading through the shell puts raw bytes straight into context with nothing to mark them
      as binary.
    method: source
  - key: announces_truncation
    status: not-applicable
    note: No read tool; the shell returns whatever the command produced.
    method: source
