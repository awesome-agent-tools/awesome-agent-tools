# OpenHands · grep
# Code-search observations read from source at the pinned commit below.
exposed_name: grep
owner:
  type: agent
  id: openhands
capabilities:
  - id: code-search
    role: primary

source:
  url: https://github.com/OpenHands/software-agent-sdk
  commit: 07307cb8edfc
  checked_at: 2026-09-04
observations:
  - key: search_kind
    value: "by-content"
    source_url: https://github.com/OpenHands/software-agent-sdk/blob/07307cb8edfc/openhands-tools/openhands/tools/grep/impl.py
    method: source
  - key: search_tool_split
    value: "two tools"
    note: >-
      Separate glob and grep tools.
    source_url: https://github.com/OpenHands/software-agent-sdk/blob/07307cb8edfc/openhands-tools/openhands/tools/grep/impl.py
    method: source
  - key: search_engine
    value: "ripgrep, else system grep, else Python re"
    note: >-
      Backend is picked once at start-up by whichever binary is present
      (_select_search_backend).
    source_url: https://github.com/OpenHands/software-agent-sdk/blob/07307cb8edfc/openhands-tools/openhands/tools/grep/definition.py
    method: source
  - key: regex_dialect
    value: "varies by backend: Rust regex, POSIX, or Python re"
    note: >-
      The same pattern is handed to a different engine depending on what is
      installed on the machine. Nothing in the tool result says which one
      ran.
    source_url: https://github.com/OpenHands/software-agent-sdk/blob/07307cb8edfc/openhands-tools/openhands/tools/grep/impl.py
    method: source
  - key: case_sensitivity_default
    value: "always insensitive, not configurable"
    note: >-
      -i is hardcoded on both binary paths and re.IGNORECASE on the Python
      path; the model cannot ask for a case-sensitive search.
    source_url: https://github.com/OpenHands/software-agent-sdk/blob/07307cb8edfc/openhands-tools/openhands/tools/grep/definition.py
    method: source
  - key: search_line_numbers
    value: "none — file paths only"
    note: >-
      rg -l / grep -l. The model is told which files match, not where.
    source_url: https://github.com/OpenHands/software-agent-sdk/blob/07307cb8edfc/openhands-tools/openhands/tools/grep/impl.py
    method: source
  - key: result_cap
    value: "100 files"
    source_url: https://github.com/OpenHands/software-agent-sdk/blob/07307cb8edfc/openhands-tools/openhands/tools/grep/impl.py
    method: source
  - key: search_announces_truncation
    value: "true"
    note: >-
      "[Results truncated to first 100 files. Consider using a more specific
      pattern.]"
    source_url: https://github.com/OpenHands/software-agent-sdk/blob/07307cb8edfc/openhands-tools/openhands/tools/grep/impl.py
    method: source
  - key: no_match_signal
    value: "sentence"
    note: >-
      "No files found containing pattern the pattern and directory named".
    source_url: https://github.com/OpenHands/software-agent-sdk/blob/07307cb8edfc/openhands-tools/openhands/tools/grep/impl.py
    method: source
  - key: grep_line_agrees_with_read
    status: not-applicable
    note: >-
      No line numbers are reported, so there is nothing to disagree.
    method: source
  - key: search_marks_file_read
    status: unverified
    method: source
  - key: respects_gitignore
    value: "varies by backend: yes under ripgrep, no otherwise"
    note: >-
      rg honours .gitignore by default; grep -R and the os.walk fallback do
      not. Whether the agent can see an ignored file depends on the machine.
    source_url: https://github.com/OpenHands/software-agent-sdk/blob/07307cb8edfc/openhands-tools/openhands/tools/grep/definition.py
    method: source
  - key: searches_hidden_files
    value: "no"
    note: >-
      _path_matches_filters drops any path with a dot-prefixed component.
    source_url: https://github.com/OpenHands/software-agent-sdk/blob/07307cb8edfc/openhands-tools/openhands/tools/grep/definition.py
    method: source
  - key: search_binary_guard
    value: "true"
    note: >-
      Only paths are returned, so no matched bytes reach the context window.
    source_url: https://github.com/OpenHands/software-agent-sdk/blob/07307cb8edfc/openhands-tools/openhands/tools/grep/impl.py
    method: source
  - key: result_ordering
    value: "modification time, newest first"
    note: >-
      --sortr=modified, re-sorted by st_mtime on every backend.
    source_url: https://github.com/OpenHands/software-agent-sdk/blob/07307cb8edfc/openhands-tools/openhands/tools/grep/impl.py
    method: source
