# pi · grep
# Code-search observations read from source at the pinned commit below.
exposed_name: grep
owner:
  type: agent
  id: pi
capabilities:
  - id: code-search
    role: primary

source:
  url: https://github.com/earendil-works/pi
  commit: da840b621657
  checked_at: 2026-09-05
observations:
  - key: search_kind
    value: "by-content"
    source_url: https://github.com/earendil-works/pi/blob/da840b621657/packages/coding-agent/src/core/tools/grep.ts
    method: source
  - key: search_tool_split
    value: "two tools"
    source_url: https://github.com/earendil-works/pi/blob/da840b621657/packages/coding-agent/src/core/tools/grep.ts
    method: source
  - key: search_engine
    value: "bundled ripgrep"
    note: >-
      Downloaded on first use rather than vendored; the tool errors with
      "ripgrep (rg) is not available and could not be downloaded" if that
      fails, so it never silently falls back to something else.
    source_url: https://github.com/earendil-works/pi/blob/da840b621657/packages/coding-agent/src/core/tools/grep.ts
    method: source
  - key: regex_dialect
    value: "Rust regex"
    note: >-
      A literal-string mode is available as a parameter, which is the escape
      hatch for a pattern the dialect will not take.
    source_url: https://github.com/earendil-works/pi/blob/da840b621657/packages/coding-agent/src/core/tools/grep.ts
    method: source
  - key: case_sensitivity_default
    value: "sensitive, model can ask"
    note: >-
      ignoreCase defaults to false and is exposed as a parameter.
    source_url: https://github.com/earendil-works/pi/blob/da840b621657/packages/coding-agent/src/core/tools/grep.ts
    method: source
  - key: search_line_numbers
    value: "path:N:"
    note: >-
      Context lines use path-N- instead, so a match is distinguishable from
      its surroundings without counting.
    source_url: https://github.com/earendil-works/pi/blob/da840b621657/packages/coding-agent/src/core/tools/grep.ts
    method: source
  - key: result_cap
    value: "100 matches or 30KB"
    note: >-
      Whichever is hit first, plus a per-line character cap.
    source_url: https://github.com/earendil-works/pi/blob/da840b621657/packages/coding-agent/src/core/tools/grep.ts
    method: source
  - key: search_announces_truncation
    value: "true"
    note: >-
      Separate notices for the match cap, the byte cap and the per-line cap;
      the line-cap notice names the read tool as the way to see the rest.
    source_url: https://github.com/earendil-works/pi/blob/da840b621657/packages/coding-agent/src/core/tools/grep.ts
    method: source
  - key: no_match_signal
    value: "sentence"
    note: '"No matches found".'
    source_url: https://github.com/earendil-works/pi/blob/da840b621657/packages/coding-agent/src/core/tools/grep.ts
    method: source
  - key: grep_line_agrees_with_read
    value: "true"
    note: >-
      Both 1-indexed; rg --line-number counts from one and pi's read tool
      takes a 1-indexed offset.
    source_url: https://github.com/earendil-works/pi/blob/da840b621657/packages/coding-agent/src/core/tools/grep.ts
    method: source
  - key: search_marks_file_read
    status: unverified
    method: source
  - key: respects_gitignore
    value: "yes"
    note: >-
      Stated in the tool description the model sees, not only in the argv.
    source_url: https://github.com/earendil-works/pi/blob/da840b621657/packages/coding-agent/src/core/tools/grep.ts
    method: source
  - key: searches_hidden_files
    value: "yes"
    note: "--hidden is passed unconditionally."
    source_url: https://github.com/earendil-works/pi/blob/da840b621657/packages/coding-agent/src/core/tools/grep.ts
    method: source
  - key: search_binary_guard
    status: unverified
    method: source
  - key: result_ordering
    value: "ripgrep traversal order"
    note: "No --sort flag."
    source_url: https://github.com/earendil-works/pi/blob/da840b621657/packages/coding-agent/src/core/tools/grep.ts
    method: source
