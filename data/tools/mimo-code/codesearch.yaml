# MiMo Code · codesearch
#
# Recategorised by the code-search source pass. The seed inventory had this
# under `code-search` on the strength of its name; the source shows it calls
# Exa's get_code_context_exa over HTTP and returns library and API
# documentation from the public internet. It never touches the repository, so
# it is a web search that happens to be about code, and leaving it in the
# code-search comparison would have put a remote documentation lookup in a
# table about finding files on disk.
exposed_name: codesearch
owner:
  type: agent
  id: mimo-code
capabilities:
  - id: web-search
    role: partial

source:
  url: https://github.com/XiaomiMiMo/MiMo-Code
  commit: 6203ea2e292b
  checked_at: 2026-09-05
